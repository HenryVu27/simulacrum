[project]
name = "umwelt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "Vuducdung28@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "flax>=0.12.12",
    "jax[cpu]>=0.12.0.1",
    "matplotlib>=3.11.2",
    "mujoco>=3.17.0",
    "numpy>=2.5.4",
    "optax>=0.2.8",
    "python-sat>=1.9.dev19",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
# NVIDIA GPU, Linux only (on Windows, inside WSL2): uv sync --extra gpu. See docs/gpu.md.
gpu = [
    # JAX keeps the compile cache's size cap (job.sh) only with filelock; without it the cache is never used
    "filelock>=4.2.9 ; sys_platform == 'linux'",
    "jax[cuda13]>=0.12.0.1 ; sys_platform == 'linux'",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
umwelt = "umwelt.cli:main"
